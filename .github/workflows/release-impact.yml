name: Release Impact

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: release-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark PR head pending
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: "pending",
              context: "release-impact",
              description: "Validating release impact",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read current PR body as opaque data
        id: read
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          [[ "$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")" == "$EVENT_HEAD" ]]
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          echo "head=$EVENT_HEAD" >> "$GITHUB_OUTPUT"
          echo "updated_at=$(jq -r '.updated_at' "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - name: Validate declaration
        id: contract
        if: steps.read.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          result=$(python3 Scripts/release_contract.py impact --body "$RUNNER_TEMP/pr-body.md")
          echo "impact=$(jq -r '.impact' <<<"$result")" >> "$GITHUB_OUTPUT"
          echo "issue=$(jq -r '.issue // ""' <<<"$result")" >> "$GITHUB_OUTPUT"

      - name: Validate bundled Release Issue
        id: bundled
        if: steps.contract.outcome == 'success' && steps.contract.outputs.impact == 'bundled'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.contract.outputs.issue }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/release-issue.json"
          [[ "$(jq -r '.state' "$RUNNER_TEMP/release-issue.json")" == "open" ]]
          [[ "$(jq -r 'has("pull_request")' "$RUNNER_TEMP/release-issue.json")" == "false" ]]
          jq -e '.labels | map(.name) | index("release") != null' \
            "$RUNNER_TEMP/release-issue.json" >/dev/null

      - name: Publish PR head result
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          EXPECTED_HEAD: ${{ steps.read.outputs.head }}
          EXPECTED_UPDATED_AT: ${{ steps.read.outputs.updated_at }}
          READ_OUTCOME: ${{ steps.read.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
          IMPACT: ${{ steps.contract.outputs.impact }}
          BUNDLED_OUTCOME: ${{ steps.bundled.outcome }}
        with:
          script: |
            const pull = (await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            })).data;
            const bundledPassed = process.env.IMPACT !== "bundled" || process.env.BUNDLED_OUTCOME === "success";
            const passed = process.env.READ_OUTCOME === "success"
              && process.env.CONTRACT_OUTCOME === "success"
              && bundledPassed
              && pull.head.sha === process.env.EXPECTED_HEAD
              && pull.updated_at === process.env.EXPECTED_UPDATED_AT;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: passed ? "success" : "failure",
              context: "release-impact",
              description: passed ? "Release impact is valid" : "Release impact is missing, invalid, or stale",
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) core.setFailed("Release impact validation failed.");
